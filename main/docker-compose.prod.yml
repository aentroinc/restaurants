services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aentro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aentro_prod}
      POSTGRES_DB: restaurant_os
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aentro"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://aentro:${DB_PASSWORD:-aentro_prod}@db:5432/restaurant_os
      DATABASE_URL_SYNC: postgresql://aentro:${DB_PASSWORD:-aentro_prod}@db:5432/restaurant_os
      ENVIRONMENT: production
      STRICT_AUTH: ${STRICT_AUTH:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: https://${PUBLIC_HOST:-localhost}/api
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata_prod:
  certbot_www:
