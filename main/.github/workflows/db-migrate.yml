name: DB Migrate

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      sha:
        description: "Image tag to use for migration container"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      sha:
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pick network config
        id: net
        run: |
          case "${{ inputs.env }}" in
            dev)     echo "cfg<<EOF" >> $GITHUB_OUTPUT; echo '${{ secrets.DEV_NETWORK_CONFIG }}'     >> $GITHUB_OUTPUT; echo "EOF" >> $GITHUB_OUTPUT;;
            staging) echo "cfg<<EOF" >> $GITHUB_OUTPUT; echo '${{ secrets.STAGING_NETWORK_CONFIG }}' >> $GITHUB_OUTPUT; echo "EOF" >> $GITHUB_OUTPUT;;
            prod)    echo "cfg<<EOF" >> $GITHUB_OUTPUT; echo '${{ secrets.PROD_NETWORK_CONFIG }}'    >> $GITHUB_OUTPUT; echo "EOF" >> $GITHUB_OUTPUT;;
          esac

      - name: Run alembic upgrade head via ECS RunTask
        run: |
          aws ecs run-task \
            --cluster "aentro-${{ inputs.env }}" \
            --task-definition "aentro-${{ inputs.env }}-migration" \
            --launch-type FARGATE \
            --network-configuration '${{ steps.net.outputs.cfg }}' \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","upgrade","head"]}]}' \
            --region "${AWS_REGION}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## DB Migrate ${{ inputs.env }}"
            echo ""
            echo "- sha: \`${{ inputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
