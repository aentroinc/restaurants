name: CD

on:
  push:
    branches: [main]
    paths:
      - "main/backend/**"
      - "main/frontend/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.build-backend.outputs.image }}
      frontend_image: ${{ steps.build-frontend.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend
        id: build-backend
        run: |
          IMAGE="${ECR_REGISTRY}/aentro-backend:${{ steps.tag.outputs.tag }}"
          docker build -f main/backend/Dockerfile.prod -t $IMAGE main/backend/
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        id: build-frontend
        run: |
          IMAGE="${ECR_REGISTRY}/aentro-frontend:${{ steps.tag.outputs.tag }}"
          docker build -f main/frontend/Dockerfile.prod -t $IMAGE main/frontend/
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run database migration
        run: |
          aws ecs run-task \
            --cluster aentro-staging \
            --task-definition aentro-staging-migration \
            --launch-type FARGATE \
            --network-configuration "${{ secrets.STAGING_NETWORK_CONFIG }}" \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","upgrade","head"]}]}'

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster aentro-staging \
            --service aentro-staging-backend \
            --force-new-deployment \
            --task-definition aentro-staging-backend

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster aentro-staging \
            --service aentro-staging-frontend \
            --force-new-deployment \
            --task-definition aentro-staging-frontend

      - name: Wait for stable deployment
        run: |
          aws ecs wait services-stable \
            --cluster aentro-staging \
            --services aentro-staging-backend aentro-staging-frontend

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run database migration
        run: |
          aws ecs run-task \
            --cluster aentro-prod \
            --task-definition aentro-prod-migration \
            --launch-type FARGATE \
            --network-configuration "${{ secrets.PROD_NETWORK_CONFIG }}" \
            --overrides '{"containerOverrides":[{"name":"migration","command":["alembic","upgrade","head"]}]}'

      - name: Deploy backend to ECS (with circuit breaker)
        run: |
          aws ecs update-service \
            --cluster aentro-prod \
            --service aentro-prod-backend \
            --force-new-deployment

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster aentro-prod \
            --service aentro-prod-frontend \
            --force-new-deployment

      - name: Wait for stable deployment
        run: |
          aws ecs wait services-stable \
            --cluster aentro-prod \
            --services aentro-prod-backend aentro-prod-frontend
