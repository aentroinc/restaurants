name: Rollback

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      target_sha:
        description: "Git short SHA to roll back to (or 'previous')"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run rollback.sh
        run: |
          chmod +x main/infra/scripts/*.sh
          main/infra/scripts/rollback.sh \
            "${{ inputs.env }}" \
            "${{ inputs.target_sha }}"

      - name: Wait for ECS service stable
        run: |
          aws ecs wait services-stable \
            --cluster "aentro-${{ inputs.env }}" \
            --services "aentro-${{ inputs.env }}-backend" "aentro-${{ inputs.env }}-frontend" \
            --region "${AWS_REGION}"

      - name: Healthcheck after rollback
        env:
          HC_URL: ${{ inputs.env == 'prod' && 'https://app.aentro.io' || format('https://{0}.aentro.io', inputs.env) }}
        run: |
          main/infra/scripts/healthcheck.sh "${HC_URL}" 30 10

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rollback ${{ inputs.env }}"
            echo ""
            echo "- target_sha: \`${{ inputs.target_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
