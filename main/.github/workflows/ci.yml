name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "main/**"
  pull_request:
    branches: [main]
    paths:
      - "main/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python lint
        run: |
          pip install ruff
          ruff check main/backend/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: main/frontend/package-lock.json

      - name: TypeScript check
        run: |
          cd main/frontend
          npm ci
          npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: restaurant_os_test
          POSTGRES_USER: aentro
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aentro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend tests
        env:
          DATABASE_URL: postgresql://aentro:test_password@localhost:5432/restaurant_os_test
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret
        run: |
          cd main/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
          pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: main/frontend/package-lock.json

      - name: Frontend build
        run: |
          cd main/frontend
          npm ci
          npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r main/backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: main/frontend/package-lock.json

      - name: npm audit
        run: |
          cd main/frontend
          npm ci
          npm audit --audit-level=high || true

      - name: Trivy container scan - backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: main/backend/
          severity: HIGH,CRITICAL

      - name: Trivy container scan - frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: main/frontend/
          severity: HIGH,CRITICAL
