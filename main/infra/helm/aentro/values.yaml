image:
  backend:
    repository: ghcr.io/aentroinc/restaurants-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/aentroinc/restaurants-frontend
    tag: latest
    pullPolicy: IfNotPresent

backend:
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  env:
    ENVIRONMENT: production
    STRICT_TENANT_MODE: "true"
    PII_REDACTION_ENABLED: "true"
    AUTO_CREATE_SCHEMA: "false"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

frontend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

postgres:
  enabled: false   # use external (Aurora / Cloud SQL) by default

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: aentro.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: aentro-tls
      hosts: [aentro.example.com]

externalSecrets:
  enabled: true
  secretStore: aws-secrets-manager
  secretsPath: aentro/prod
