global:
  environment: prod

backend:
  replicaCount: 2
  image:
    repository: aentro/backend
    tag: "" # set by CI / promote.sh
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    ENVIRONMENT: production
    LOG_LEVEL: INFO

frontend:
  replicaCount: 2
  image:
    repository: aentro/frontend
    tag: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"

ingress:
  hosts:
    - host: app.aentro.io
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: aentro-prod-tls
      hosts:
        - app.aentro.io

externalSecrets:
  secrets:
    - key: aentro-prod/database-url
      property: DATABASE_URL
    - key: aentro-prod/jwt-secret
      property: JWT_SECRET_KEY
    - key: aentro-prod/anthropic-api-key
      property: ANTHROPIC_API_KEY
    - key: aentro-prod/ingestion-master-key
      property: INGESTION_MASTER_KEY
