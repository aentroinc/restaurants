<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0e14"/>
  <title>オフライン — AENTRO</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#0a0e14;color:rgba(255,255,255,.92);
      font-family:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:24px;text-align:center}
    .logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#1e3a8a,#0c1e4a);
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:36px;color:#fff;margin-bottom:24px}
    h1{font-size:22px;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
    p{font-size:14px;line-height:1.6;color:rgba(255,255,255,.65);margin:0 0 24px;max-width:320px}
    button{appearance:none;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
      color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
    button:hover{background:rgba(255,255,255,.1)}
    button:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
    .hint{font-size:11px;color:rgba(255,255,255,.4);margin-top:32px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
</head>
<body>
  <main role="main">
    <div class="logo" aria-hidden="true">A</div>
    <h1>オフラインです</h1>
    <p>ネットワークに接続できません。電波状況をご確認ください。<br/>キャッシュ済みのページは引き続き利用できます。</p>
    <button type="button" onclick="location.reload()" aria-label="再読み込み">再読み込み</button>
    <div class="hint">AENTRO Restaurant OS · Offline</div>
  </main>
</body>
</html>
